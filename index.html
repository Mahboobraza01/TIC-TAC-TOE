<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <!-- ===== SETUP SCREEN ===== -->
    <section id="setupScreen" class="screen">
      <div class="logo">
        <svg viewBox="0 0 24 24" class="mark-icon mark-x"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
        <svg viewBox="0 0 24 24" class="mark-icon mark-o"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/></svg>
      </div>

      <div class="card">
        <p class="card-title">Pick Player 1's Mark</p>
        <div class="toggle" id="markToggle">
          <button class="toggle-btn active" data-mark="X" aria-pressed="true">
            <svg viewBox="0 0 24 24" class="mark-icon mark-x"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          </button>
          <button class="toggle-btn" data-mark="O" aria-pressed="false">
            <svg viewBox="0 0 24 24" class="mark-icon mark-o"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/></svg>
          </button>
        </div>
        <p class="hint">Remember: X goes first</p>
      </div>

      <button id="startCpuBtn" class="btn btn-yellow">New Game (vs CPU)</button>
      <button id="startFriendBtn" class="btn btn-teal">New Game (vs Player)</button>
    </section>

    <!-- ===== GAME SCREEN ===== -->
    <section id="gameScreen" class="screen hidden">
      <header class="game-header">
        <button id="homeBtn" class="logo-btn" aria-label="Back to setup">
          <svg viewBox="0 0 24 24" class="mark-icon mark-x small"><path d="M5 5L19 19M19 5L5 19" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 24 24" class="mark-icon mark-o small"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="4"/></svg>
        </button>

        <div class="turn-indicator" id="turnIndicator">
          <span id="turnIcon" class="turn-icon"></span>
          <span>Turn</span>
        </div>

        <button id="resetBtn" class="icon-btn" aria-label="Reset board">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-3-6.7"/>
            <path d="M21 4v5h-5"/>
          </svg>
        </button>
      </header>

      <div id="board" class="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>

      <div class="scoreboard">
        <div class="score-card score-x">
          <span class="score-label" id="scoreXLabel">X (YOU)</span>
          <span class="score-value" id="scoreXValue">0</span>
        </div>
        <div class="score-card score-ties">
          <span class="score-label">Ties</span>
          <span class="score-value" id="scoreDrawValue">0</span>
        </div>
        <div class="score-card score-o">
          <span class="score-label" id="scoreOLabel">O (CPU)</span>
          <span class="score-value" id="scoreOValue">0</span>
        </div>
      </div>

      <p id="message" class="message"></p>
    </section>

  </div>

  <p class="copyright">© by_mr.mahboobraza</p>

  <script src="script.js"></script>
</body>
</html>
